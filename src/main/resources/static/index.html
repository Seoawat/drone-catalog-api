<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог дронов</title>

    <!-- ПОДКЛЮЧЕНИЕ CSS-СТИЛЕЙ -->

    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- БЛОК 2: HTML-РАЗМЕТКА (содержимое страницы)  -->

<div class="container">
    <h1>🚁 Каталог дронов</h1>

    <!-- Панель фильтров -->
    <div class="filters">
        <div class="filter-group">
            <label>Тип</label>
            <select id="filter-type">
                <option value="">Все типы</option>
                <option value="multirotor">Мультиротор</option>
                <option value="fixed-wing">Самолет</option>
                <option value="hybrid">Гибрид</option>
                <option value="helicopter">Вертолет</option>
            </select>
        </div>
        <div class="filter-group">
            <label>Производитель</label>
            <input type="text" id="filter-manufacturer" placeholder="Например: ZALA">
        </div>
        <div class="filter-group">
            <label>Мин. вес (кг)</label>
            <input type="number" id="filter-minWeight" step="0.1" placeholder="0">
        </div>
        <div class="filter-group">
            <label>Мин. время полета (мин)</label>
            <input type="number" id="filter-minFlightTime" placeholder="0">
        </div>
        <div class="filter-group" style="justify-content: flex-end;">
            <button class="btn btn-primary" onclick="loadDrones()">Применить фильтр</button>
        </div>
    </div>

    <!-- Кнопка добавления -->
    <div class="actions">
        <button class="btn btn-secondary" onclick="openModal()"> Добавить дрона</button>
    </div>

    <!-- Блок ошибок -->
    <div id="error-message"></div>

    <!-- Таблица -->
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Название</th>
            <th>Производитель</th>
            <th>Тип</th>
            <th>Вес (кг)</th>
            <th>Время полета (мин)</th>
            <th>Год</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody id="drones-table">
        <tr><td colspan="8" class="loading">Загрузка...</td></tr>
        </tbody>
    </table>

    <!-- Пагинация -->
    <div class="pagination" id="pagination"></div>
</div>

<!-- Модальное окно -->
<div id="drone-modal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modal-title">Добавить дрона</h2>
            <span class="close" onclick="closeModal()">&times;</span>
        </div>
        <form id="drone-form">
            <input type="hidden" id="drone-id">
            <div class="form-group">
                <label>Название *</label>
                <input type="text" id="drone-name" required>
            </div>
            <div class="form-group">
                <label>Производитель *</label>
                <input type="text" id="drone-manufacturer" required>
            </div>
            <div class="form-group">
                <label>Тип *</label>
                <select id="drone-type" required>
                    <option value="multirotor">Мультиротор</option>
                    <option value="fixed-wing">Самолет</option>
                    <option value="hybrid">Гибрид</option>
                    <option value="helicopter">Вертолет</option>
                </select>
            </div>
            <div class="form-group">
                <label>Макс. взлетная масса (кг) *</label>
                <input type="number" id="drone-maxTakeoffWeight" step="0.1" required>
            </div>
            <div class="form-group">
                <label>Макс. время полета (мин) *</label>
                <input type="number" id="drone-maxFlightTime" required>
            </div>
            <div class="form-group">
                <label>Год выпуска</label>
                <input type="number" id="drone-releaseYear">
            </div>
            <div class="form-group">
                <label>Описание</label>
                <textarea id="drone-description"></textarea>
            </div>
            <div class="form-group">
                <label>Дальность (км)</label>
                <input type="number" id="drone-maxRange" step="0.1">
            </div>
            <div class="form-group">
                <label>Грузоподъемность (кг)</label>
                <input type="number" id="drone-payloadCapacity" step="0.1">
            </div>
            <div class="form-group">
                <label>Тип сенсоров</label>
                <input type="text" id="drone-sensorType" placeholder="RGB,Thermal">
            </div>
            <div class="form-group">
                <label>Класс защиты</label>
                <input type="text" id="drone-ipRating" placeholder="IP54">
            </div>
            <div class="form-actions">
                <button type="button" class="btn btn-danger" onclick="closeModal()">Отмена</button>
                <button type="submit" class="btn btn-primary">Сохранить</button>
            </div>
        </form>
    </div>
</div>

<!-- ПОДКЛЮЧЕНИЕ JAVASCRIPT -->

<script src="/js/app.js"></script>
</body>
</html>
